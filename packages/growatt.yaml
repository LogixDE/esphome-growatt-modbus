    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt_data
    id: inverter_dc_2_power
    name: "PV2 power"
    register_type: read
    address: 9
    value_type: S_DWORD
    unit_of_measurement: "W"
    device_class: "power"
    state_class: "measurement"
