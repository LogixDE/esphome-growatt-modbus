      int v = ((int) id(raw_battery_mode_state).state) % 256;
      switch (v) {
        case 0: return {"standby"};
        case 1: return {"normal"};
        case 2: return {"fault"};
        case 3: return {"flash"};
        default: return {to_string(v)};
      }

  - platform: template
    name: "Battery derating mode"
    id: battery_deratingmode
    icon: mdi:battery-minus
    update_interval: ${update_interval}
    lambda: |-
      if (!id(growatt_is_online) || isnan(id(raw_battery_deratingmode).state)) return {"unavailable"};
      int v = (int) id(raw_battery_deratingmode).state;
      static const char *reasons[] = {
        "Normal, unrestricted", "System fault", "System warning",
        "Maximum charging current of battery (charging)", "Battery high temperature (charging)",
        "Reserve (charging)", "SOC setting limits (charging)", "Battery low temperature (charging)",
        "High bus voltage (charging)", "Full charged (charging)", "Reserve (charging)",
        "System warning no charging (charging)", "User setting the current of charging (charging)",
        "BM charge current limited (charging)", "Reserve (charging)", "Reserve (charging)",
        "Reserve (charging)", "Maximum battery current limit (discharge)",
        "Battery discharge Enable (discharge)", "High bus discharge derating (discharge)",
        "High temperature discharge derating (discharge)", "System warning no discharge (discharge)",
        "User setting the current of discharging (discharge)", "BM discharge current limited (discharge)",
        "Reserved (discharge)", "Reserved (discharge)", "Reserved (discharge)", "Reserved (discharge)",
        "Reserved (discharge)", "Reserved (discharge)", "Reserved (discharge)", "Reserved (discharge)",
        "Reserved (discharge)"
      };
      if (v >= 0 && v < 33) return {reasons[v]};
      return {to_string(v)};

