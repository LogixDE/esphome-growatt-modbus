    id: battery_discharge_rate
    name: "Battery discharge rate setting"
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    mode: box
    optimistic: false  # Publish explicitly only after queue admission.
    set_action:
      - lambda: |-
