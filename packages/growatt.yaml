# ESPHome Growatt Modbus package
# Repository: https://github.com/LogixDE/esphome-growatt-modbus
# License: MIT
#
# This file intentionally contains no Wi-Fi, API, OTA or secret lookups.
# Configure those in the local device YAML.

substitutions:
  modbus_device_address: "1"
  update_interval: "5s"  # Heartbeat; also the scheduler resolution.
  # Poll periods in milliseconds, evaluated after a successful heartbeat.
  # Effective periods are rounded up to heartbeat ticks; no catch-up bursts.
  fast_poll_ms: "5000"
  temperature_poll_ms: "30000"
  energy_poll_ms: "60000"
  settings_poll_ms: "60000"
  meter_poll_ms: "5000"
  modbus_baud_rate: "38400"
  uart_tx_pin: "GPIO17"
  uart_rx_pin: "GPIO18"
  uart_flow_control_pin: "GPIO21"

esphome:
  # Shown in Home Assistant as manufacturer ("by Fabian Harder") and model.
  project:
    name: "Fabian Harder.Growatt Modbus"
    version: "1.1.0"
  on_boot:
    priority: -100
    then:
      - binary_sensor.template.publish:
          id: growatt_online
          state: OFF

# --- RS485 / Modbus RTU -------------------------------------------------------
uart:
  id: uart_bus
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: ${modbus_baud_rate}
  flow_control_pin: ${uart_flow_control_pin}

modbus:
  id: modbus_bus
  uart_id: uart_bus

modbus_controller:
  # Heartbeat: liest ausschliesslich Register 0. Erst nach einer erfolgreichen
  # Antwort wird der eigentliche Daten-Controller angestossen.
  - id: growatt_status
    address: ${modbus_device_address}
    modbus_id: modbus_bus
    update_interval: never
    max_cmd_retries: 1
    offline_skip_updates: 0
    on_offline:
      then:
        - lambda: |-
            id(growatt_is_online) = false;
            id(growatt_poll_initialized) = false;
            id(growatt_online).publish_state(false);

            // Alle numerischen Mess-/Statuswerte invalidieren. NAN wird von
            // ESPHome/HA als ungueltiger bzw. nicht verfuegbarer Sensorwert behandelt.
            id(raw_inverter_state).publish_state(NAN);
            id(raw_inverter_operating_enable).publish_state(NAN);
            id(inverter_power).publish_state(NAN);
            id(inverter_powerac).publish_state(NAN);
            id(inverter_energy_today).publish_state(NAN);
            id(inverter_energy_total).publish_state(NAN);
            id(inverter_freq).publish_state(NAN);
            id(inverter_temp_1).publish_state(NAN);
            id(inverter_temp_2).publish_state(NAN);
            id(inverter_temp_3).publish_state(NAN);
            id(inverter_failure_main).publish_state(NAN);
            id(inverter_failure_sub).publish_state(NAN);
            id(inverter_ac_1_voltage).publish_state(NAN);
            id(inverter_ac_1_current).publish_state(NAN);
            id(inverter_ac_1_power).publish_state(NAN);
            id(inverter_ac_2_voltage).publish_state(NAN);
            id(inverter_ac_2_current).publish_state(NAN);
            id(inverter_ac_2_power).publish_state(NAN);
            id(inverter_ac_3_voltage).publish_state(NAN);
            id(inverter_ac_3_current).publish_state(NAN);
            id(inverter_ac_3_power).publish_state(NAN);
            id(inverter_dc_1_voltage).publish_state(NAN);
            id(inverter_dc_1_current).publish_state(NAN);
            id(inverter_dc_1_power).publish_state(NAN);
            id(inverter_dc_1_energy_today).publish_state(NAN);
            id(inverter_dc_1_energy_total).publish_state(NAN);
            id(inverter_dc_2_voltage).publish_state(NAN);
            id(inverter_dc_2_current).publish_state(NAN);
            id(inverter_dc_2_power).publish_state(NAN);
            id(inverter_dc_2_energy_today).publish_state(NAN);
            id(inverter_dc_2_energy_total).publish_state(NAN);
            id(inverter_dc_3_voltage).publish_state(NAN);
            id(inverter_dc_3_current).publish_state(NAN);
            id(inverter_dc_3_power).publish_state(NAN);
            id(inverter_dc_3_energy_today).publish_state(NAN);
            id(inverter_dc_3_energy_total).publish_state(NAN);
            id(battery_fault).publish_state(NAN);
            id(battery_warning).publish_state(NAN);
            id(battery_voltage).publish_state(NAN);
            id(battery_current).publish_state(NAN);
            id(battery_soc).publish_state(NAN);
            id(battery_dischargepower).publish_state(NAN);
            id(battery_chargepower).publish_state(NAN);
            id(battery_energy_discharged_today).publish_state(NAN);
            id(battery_energy_discharged_total).publish_state(NAN);
            id(battery_energy_charged_today).publish_state(NAN);
            id(battery_energy_charged_total).publish_state(NAN);
            id(raw_inverter_derating).publish_state(NAN);
            id(raw_battery_deratingmode).publish_state(NAN);
            id(raw_battery_mode_state).publish_state(NAN);

            id(emeter_ac_1_voltage).publish_state(NAN);
            id(emeter_ac_2_voltage).publish_state(NAN);
            id(emeter_ac_3_voltage).publish_state(NAN);
            id(emeter_ac_1_current).publish_state(NAN);
            id(emeter_ac_2_current).publish_state(NAN);
            id(emeter_ac_3_current).publish_state(NAN);
            id(emeter_ac_1_power).publish_state(NAN);
            id(emeter_ac_2_power).publish_state(NAN);
            id(emeter_ac_3_power).publish_state(NAN);
            id(emeter_power).publish_state(NAN);
            id(emeter_energy_total_import).publish_state(NAN);
            id(emeter_energy_total_export).publish_state(NAN);
            id(battery_power_net).publish_state(NAN);
            id(pv_energy_today).publish_state(NAN);
            id(pv_energy_total).publish_state(NAN);
            id(inverter_epv_total).publish_state(NAN);
            id(emeter_consumption).publish_state(NAN);
            id(emeter_surplus).publish_state(NAN);

            // Auch die intern gehaltenen Zeitfenster-Rohregister invalidieren.
            id(period1_raw_hi).publish_state(NAN); id(period1_raw_lo).publish_state(NAN);
            id(period2_raw_hi).publish_state(NAN); id(period2_raw_lo).publish_state(NAN);
            id(period3_raw_hi).publish_state(NAN); id(period3_raw_lo).publish_state(NAN);
            id(period4_raw_hi).publish_state(NAN); id(period4_raw_lo).publish_state(NAN);
            id(period5_raw_hi).publish_state(NAN); id(period5_raw_lo).publish_state(NAN);
            id(period6_raw_hi).publish_state(NAN); id(period6_raw_lo).publish_state(NAN);
            id(period7_raw_hi).publish_state(NAN); id(period7_raw_lo).publish_state(NAN);
            id(period8_raw_hi).publish_state(NAN); id(period8_raw_lo).publish_state(NAN);
            id(period9_raw_hi).publish_state(NAN); id(period9_raw_lo).publish_state(NAN);

            // Schreibbare Number-Entities bekommen ebenfalls keinen alten Wert mehr angezeigt.
            id(battery_discharge_rate).publish_state(NAN);
            id(battery_discharge_soc_offgrid).publish_state(NAN);
            id(battery_discharge_soc_ongrid).publish_state(NAN);
            id(battery_charge_rate).publish_state(NAN);
            id(battery_charge_soc).publish_state(NAN);

  # Alle eigentlichen Datenregister werden nur manuell nach einem erfolgreichen
  # Heartbeat aktualisiert.
  - id: growatt_data
    address: ${modbus_device_address}
    modbus_id: modbus_bus
    update_interval: never
    max_cmd_retries: 1
    offline_skip_updates: 0

  - id: growatt_temperature
    address: ${modbus_device_address}
    modbus_id: modbus_bus
    update_interval: never
    max_cmd_retries: 1
    offline_skip_updates: 0

  - id: growatt_energy
    address: ${modbus_device_address}
    modbus_id: modbus_bus
    update_interval: never
    max_cmd_retries: 1
    offline_skip_updates: 0

  - id: growatt_settings
    address: ${modbus_device_address}
    modbus_id: modbus_bus
    update_interval: never
    max_cmd_retries: 1
    offline_skip_updates: 0

# Never enqueue a new poll batch while the previous batch or a write is active.
# The hub drains its in-flight response and retries before a write can start.
interval:
  - interval: ${update_interval}
    then:
      - if:
          condition:
            lambda: 'return !id(growatt_write_in_progress) && (id(modbus_bus).tx_buffer_empty() && !id(modbus_bus).tx_blocked());'
          then:
            - component.update: growatt_status

  # Coalesce missed ticks into one pending refresh, never a catch-up queue.
  - interval: ${fast_poll_ms}ms
    then:
      - lambda: 'id(growatt_due_fast) = true;'

  # Coalesce missed ticks into one pending refresh, never a catch-up queue.
  - interval: ${temperature_poll_ms}ms
    then:
      - lambda: 'id(growatt_due_temperature) = true;'

  # Coalesce missed ticks into one pending refresh, never a catch-up queue.
  - interval: ${energy_poll_ms}ms
    then:
      - lambda: 'id(growatt_due_energy) = true;'

  # Coalesce missed ticks into one pending refresh, never a catch-up queue.
  - interval: ${settings_poll_ms}ms
    then:
      - lambda: 'id(growatt_due_settings) = true;'

  # Coalesce missed ticks into one pending refresh, never a catch-up queue.
  - interval: ${meter_poll_ms}ms
    then:
      - lambda: 'id(growatt_due_meter) = true;'

globals:
  # Includes the active job. This holds the poll lock across queue handovers.
  - id: growatt_write_jobs
    type: int
    restore_value: no
    initial_value: '0'
  - id: growatt_due_meter
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: growatt_due_settings
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: growatt_due_energy
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: growatt_due_temperature
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: growatt_due_fast
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: growatt_poll_initialized
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: growatt_target_2
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: growatt_target_1
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: growatt_target_ready
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: growatt_request_done
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: growatt_is_online
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: growatt_write_in_progress
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: growatt_write_ack_1
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: growatt_write_ack_2
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: growatt_readback_received
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: growatt_readback_1
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: growatt_readback_2
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: growatt_write_verified
    type: bool
    restore_value: no
    initial_value: 'false'

binary_sensor:
  - platform: template
    name: "Growatt Modbus Online"
    id: growatt_online
    device_class: connectivity

# ============================================================================
# ALLE SENSOREN IN EINEM BLOCK (YAML erlaubt "sensor:" nur einmal pro Datei)
#   1) Standard-Register FC3/FC4, 1:1 aus Mapping.cs
#   2) interne Rohwerte fuer die Enum-Text-Sensoren weiter unten
#   3) Smartmeter (FC32) als template-Sensoren, befuellt per Custom-Command (s.u.)
#   4) berechnete Werte (battery/power, emeter/consumption, emeter/surplus)
# ============================================================================
sensor:
  # FC3 holding register 0 is the operating command, NOT FC4 input register 0.
  # C# reference: battery/state/set -> ModbusWrite(0, on ? 1 : 2).
  - platform: modbus_controller
    modbus_controller_id: growatt_settings
    id: raw_inverter_operating_enable
    internal: true
    register_type: holding
    address: 0
    value_type: U_WORD
    on_value:
      then:
        - lambda: |-
            if (id(growatt_write_in_progress)) return;
            if (x == 1.0f) id(inverter_operating_enable).publish_state(true);
            else if (x == 2.0f) id(inverter_operating_enable).publish_state(false);

  - platform: modbus_controller
    modbus_controller_id: growatt_data
    id: inverter_power
    name: "PV total power"
    register_type: read
    address: 1
    value_type: S_DWORD
    unit_of_measurement: "W"
    device_class: "power"
    state_class: "measurement"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt_data
    id: inverter_powerac
    name: "Output power"
    register_type: read
    address: 35
    value_type: S_DWORD
    unit_of_measurement: "W"
    device_class: "power"
    state_class: "measurement"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Register 53/55 (Eac today/total): AC-Ausgangsenergie des Wechselrichters.
  # Beim Hybrid-WR ist hier auch die Akku-Entladung enthalten - das ist NICHT
  # die PV-Erzeugung (dafuer pv_energy_today / pv_energy_total weiter unten).
  # Name bewusst unveraendert: ESPHome leitet die unique_id aus dem Namen ab,
  # eine Umbenennung wuerde in Home Assistant neue Entities erzeugen.
  - platform: modbus_controller
    modbus_controller_id: growatt_energy
    id: inverter_energy_today
    name: "Today generate energy"
    register_type: read
    address: 53
    value_type: S_DWORD
    unit_of_measurement: "kWh"
    device_class: "energy"
    state_class: "total_increasing"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt_energy
    id: inverter_energy_total
    name: "Total generate energy"
    register_type: read
    address: 55
    value_type: S_DWORD
    unit_of_measurement: "kWh"
    device_class: "energy"
    state_class: "total_increasing"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt_data
    id: inverter_freq
    name: "Grid frequency"
    register_type: read
    address: 37
    value_type: S_WORD
    unit_of_measurement: "Hz"
    device_class: "frequency"
    state_class: "measurement"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  # Register 91/92 (Epv_total laut Growatt-Protokoll): PV-Energie gesamt.
  # Nicht von jedem Modell befuellt - zum Abgleich mit pv_energy_total.
  # Eigener Energie-Controller, daher kein gemeinsamer Lesevorgang mit 93-95.
  - platform: modbus_controller
    modbus_controller_id: growatt_energy
    id: inverter_epv_total
    name: "PV energy total (register)"
    entity_category: diagnostic
    register_type: read
    address: 91
    value_type: U_DWORD
    unit_of_measurement: "kWh"
    device_class: "energy"
    state_class: "total_increasing"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt_temperature
    id: inverter_temp_1
    name: "Inverter temperature"
    register_type: read
    address: 93
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt_temperature
    id: inverter_temp_2
    name: "IPM temperature"
    register_type: read
    address: 94
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
