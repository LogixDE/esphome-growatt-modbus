  - platform: modbus_controller
    modbus_controller_id: growatt_data
    id: inverter_ac_1_voltage
    name: "Phase 1 voltage"
    register_type: read
    address: 38
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: "voltage"
    state_class: "measurement"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt_data
    id: inverter_ac_1_current
    name: "Phase 1 current"
    register_type: read
    address: 39
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: "current"
    state_class: "measurement"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt_data
