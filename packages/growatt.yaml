  - platform: modbus_controller
    modbus_controller_id: growatt_data
    id: inverter_ac_2_voltage
    name: "Phase 2 voltage"
    register_type: read
    address: 42
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: "voltage"
    state_class: "measurement"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt_data
    id: inverter_ac_2_current
    name: "Phase 2 current"
    register_type: read
    address: 43
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: "current"
    state_class: "measurement"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt_data
    id: inverter_ac_2_power
    name: "Phase 2 power"
    register_type: read
    address: 44
    value_type: S_DWORD
    unit_of_measurement: "W"
    device_class: "power"
    state_class: "measurement"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: growatt_data
    id: inverter_ac_3_voltage
    name: "Phase 3 voltage"
    register_type: read
    address: 46
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: "voltage"
