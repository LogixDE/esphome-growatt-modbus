    id: battery_discharge_rate
    name: "Battery discharge rate setting"
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    mode: box
    optimistic: true
    set_action:
      - lambda: |-
          if (!id(growatt_is_online)) {
            ESP_LOGW("growatt_write", "Write Reg 3036 verworfen: Wechselrichter offline");
            if (!isnan(id(raw_battery_discharge_rate_setting).state))
              id(battery_discharge_rate).publish_state(id(raw_battery_discharge_rate_setting).state);
            return;
          }
          id(growatt_write_in_progress) = true;
          id(battery_discharge_rate).publish_state(x);
          id(growatt_write_verify).execute(3036, (int) x, 0, 0, 1);

