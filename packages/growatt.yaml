text_sensor:
  # Makes a missing/unknown readback visible; a switch alone has no unknown value.
  - platform: template
    id: inverter_operating_enable_state
    name: "Inverter operating enable state"
    entity_category: diagnostic
    update_interval: ${update_interval}
    lambda: |-
      if (!id(growatt_is_online)) return {"Unavailable"};
      const float value = id(raw_inverter_operating_enable).state;
      if (isnan(value)) return {"Unknown"};
      if (value == 1.0f) return {"Enabled"};
      if (value == 2.0f) return {"Disabled"};
      return str_sprintf("Unknown (%u)", (unsigned) value);

  - platform: template
    name: "Inverter run state"
    id: inverter_state
    icon: mdi:state-machine
    update_interval: ${update_interval}
    lambda: |-
      if (!id(growatt_is_online) || isnan(id(raw_inverter_state).state)) return {"unavailable"};
      int v = (int) id(raw_inverter_state).state;
      switch (v) {
        case 0: return {"Standby"};
        case 1: return {"Normal"};
        case 2: return {"Off-Grid"};
        case 3: return {"Fault"};
        default: return {to_string(v)};
      }

  - platform: template
    name: "Derating mode"
    id: inverter_derating
    icon: mdi:speedometer-slow
    update_interval: ${update_interval}
    lambda: |-
      if (!id(growatt_is_online) || isnan(id(raw_inverter_derating).state)) return {"unavailable"};
      int v = (int) id(raw_inverter_derating).state;
      static const char *reasons[] = {
        "No derating (NA)", "Bus voltage high derating", "Aging fixed power derating",
        "Grid voltage high derating", "Over-frequency reduce derating", "Single DC source mode derating",
        "Inverter module over-temperature derating", "User activated output limit derating",
        "Load speed process derating", "Over back by time derating",
        "Internal environment over-temperature derating", "External environment over-temperature derating",
        "Wire impedance derating", "Parallel inverter export limit derating",
        "Single inverter export limit derating", "Load first mode derating",
        "CT installation issue derating", "Zero current mode derating",
        "Boost module over-temperature derating", "Zero power mode derating",
        "Under-frequency increase derating", "Bus bar current limit derating"
      };
      if (v >= 0 && v < 22) return {reasons[v]};
      return {to_string(v)};

  - platform: template
    name: "Battery mode"
    id: battery_mode
    icon: mdi:battery-sync
    update_interval: ${update_interval}
    lambda: |-
      if (!id(growatt_is_online) || isnan(id(raw_battery_mode_state).state)) return {"unavailable"};
      int v = ((int) id(raw_battery_mode_state).state) / 256;
      switch (v) {
        case 0: return {"sleep"};
        case 1: return {"charge"};
        case 2: return {"discharge"};
        default: return {to_string(v)};
      }

  - platform: template
    name: "Battery state"
    id: battery_state
    icon: mdi:battery-alert
    update_interval: ${update_interval}
    lambda: |-
      if (!id(growatt_is_online) || isnan(id(raw_battery_mode_state).state)) return {"unavailable"};
      int v = ((int) id(raw_battery_mode_state).state) % 256;
      switch (v) {
        case 0: return {"standby"};
        case 1: return {"normal"};
        case 2: return {"fault"};
        case 3: return {"flash"};
        default: return {to_string(v)};
      }

  - platform: template
    name: "Battery derating mode"
    id: battery_deratingmode
    icon: mdi:battery-minus
    update_interval: ${update_interval}
    lambda: |-
      if (!id(growatt_is_online) || isnan(id(raw_battery_deratingmode).state)) return {"unavailable"};
      int v = (int) id(raw_battery_deratingmode).state;
      // MID 25KTL3-XH: Wert 1 ist je nach Protokollstand Standby ODER Fehler.
      // Nur mit vollstaendigen, widerspruchsfreien Statuswerten als Standby
      // anzeigen. Dies ist eine Anzeigeaufloesung, keine neue Registerbelegung.
      if (v == 1) {
        const float battery_state = id(raw_battery_mode_state).state;
        const float inverter_state = id(raw_inverter_state).state;
        const float main_fault = id(inverter_failure_main).state;
        const float sub_fault = id(inverter_failure_sub).state;
        const float fault_value = id(battery_fault).state;
        const float warning_value = id(battery_warning).state;
        if ((!isnan(battery_state) && (((int) battery_state & 0xFF) == 2)) ||
            (!isnan(inverter_state) && inverter_state == 3) ||
            (!isnan(main_fault) && main_fault != 0) ||
            (!isnan(sub_fault) && sub_fault != 0) ||
            (!isnan(fault_value) && fault_value != 0))
          return {"System fault"};
        if (!isnan(battery_state) && (((int) battery_state & 0xFF) == 0) &&
            inverter_state == 1 && main_fault == 0 && sub_fault == 0 &&
            fault_value == 0 && warning_value == 0)
          return {"Standby"};
        return {"Standby or fault (code 1)"};
      }
      static const char *reasons[] = {
        "Normal, unrestricted", "System fault", "System warning",
        "Maximum charging current of battery (charging)", "Battery high temperature (charging)",
        "Reserve (charging)", "SOC setting limits (charging)", "Battery low temperature (charging)",
        "High bus voltage (charging)", "Full charged (charging)", "Reserve (charging)",
        "System warning no charging (charging)", "User setting the current of charging (charging)",
        "BM charge current limited (charging)", "Reserve (charging)", "Reserve (charging)",
        "Reserve (charging)", "Maximum battery current limit (discharge)",
        "Battery discharge Enable (discharge)", "High bus discharge derating (discharge)",
        "High temperature discharge derating (discharge)", "System warning no discharge (discharge)",
        "User setting the current of discharging (discharge)", "BM discharge current limited (discharge)",
        "Reserved (discharge)", "Reserved (discharge)", "Reserved (discharge)", "Reserved (discharge)",
        "Reserved (discharge)", "Reserved (discharge)", "Reserved (discharge)", "Reserved (discharge)",
        "Reserved (discharge)"
      };
      if (v >= 0 && v < 33) return {reasons[v]};
      return {to_string(v)};

