    id: raw_inverter_state
    internal: true
    register_type: read
    address: 0
    value_type: S_WORD
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !isnan(x);'
            then:
              - lambda: |-
                  id(growatt_is_online) = true;
                  id(growatt_online).publish_state(true);
              - if:
                  condition:
                    lambda: 'return !id(growatt_write_in_progress);'
                  then:
                    - component.update: growatt_data
                    - script.execute: poll_emeter_fc32

  - platform: modbus_controller
    modbus_controller_id: growatt_data
    id: raw_inverter_derating
    internal: true
    register_type: read
    address: 3086
    value_type: S_WORD

