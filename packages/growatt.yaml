          id(battery_charge_ac).publish_state(false);
          id(growatt_write_verify).execute(3049, 0, 0, 0, 1);


# ============================================================================
# Smartmeter-Polling (FC32) - nur nach erfolgreichem Heartbeat.
# Byte-Layout/Offsets siehe Kommentar oben bei den emeter_*-Sensoren.
# ============================================================================
script:
  # Robuster Schreibpfad fuer alle FC6-Einstellungen:
  # Write -> ACK -> Readback -> Soll/Ist-Vergleich, bis zu 3 Versuche.
  # Ein Register (register_count=1) fuer Batterieparameter/AC-Charging,
  # zwei aufeinanderfolgende Register fuer ein komplettes Zeitfenster.
  - id: growatt_write_verify
    mode: queued
    max_runs: 10
    parameters:
      address_1: int
      value_1: int
      address_2: int
      value_2: int
      register_count: int
    then:
      - if:
          condition:
            lambda: 'return id(growatt_is_online);'
          then:
            - lambda: |-
                id(growatt_write_in_progress) = true;
                id(growatt_write_verified) = false;
                ESP_LOGI("growatt_write",
                         "Starte Write+Verify: Reg %d = %d%s",
                         address_1, value_1, register_count == 2 ? " (+ Folgeregister)" : "");
            # Bereits gestartete Leseabfrage darf auslaufen; waehrend des Writes
            # werden durch den Heartbeat keine neuen Datenpolls angestossen.
            - delay: 250ms
            - repeat:
                count: 3
                then:
                  - if:
                      condition:
                        lambda: 'return !id(growatt_write_verified) && id(growatt_is_online);'
                      then:
                        - lambda: |-
                            id(growatt_write_ack_1) = false;
                            id(growatt_write_ack_2) = (register_count == 1);
                            id(growatt_readback_received) = false;
                        - modbus_client.write_single_register:
                            modbus_id: modbus_bus
                            address: ${modbus_device_address}
                            start_address: !lambda 'return (uint16_t) address_1;'
                            value: !lambda 'return (uint16_t) value_1;'
                            on_response:
                              then:
                                - lambda: 'id(growatt_write_ack_1) = true;'
                            on_not_sent:
                              then:
                                - lambda: |-
                                    ESP_LOGW("growatt_write", "FC6 konnte nicht in die Sendewarteschlange");
                        - wait_until:
                            condition:
                              lambda: 'return id(growatt_write_ack_1);'
                            timeout: 2500ms
                        - if:
                            condition:
                              lambda: 'return register_count == 2 && id(growatt_write_ack_1);'
                            then:
                              - modbus_client.write_single_register:
                                  modbus_id: modbus_bus
                                  address: ${modbus_device_address}
                                  start_address: !lambda 'return (uint16_t) address_2;'
                                  value: !lambda 'return (uint16_t) value_2;'
                                  on_response:
                                    then:
                                      - lambda: 'id(growatt_write_ack_2) = true;'
                                  on_not_sent:
                                    then:
                                      - lambda: |-
                                          ESP_LOGW("growatt_write", "Zweiter FC6 konnte nicht in die Sendewarteschlange");
                              - wait_until:
                                  condition:
                                    lambda: 'return id(growatt_write_ack_2);'
                                  timeout: 2500ms
                        - if:
                            condition:
                              lambda: 'return id(growatt_write_ack_1) && id(growatt_write_ack_2);'
                            then:
                              - delay: 750ms
                              - lambda: 'id(growatt_readback_received) = false;'
                              - modbus_client.read_holding_registers:
                                  modbus_id: modbus_bus
                                  address: ${modbus_device_address}
                                  start_address: !lambda 'return (uint16_t) address_1;'
                                  count: !lambda 'return (uint16_t) register_count;'
                                  on_response:
                                    then:
                                      - lambda: |-
                                          if (!values.empty()) id(growatt_readback_1) = values[0];
                                          if (values.size() > 1) id(growatt_readback_2) = values[1];
                                          id(growatt_readback_received) = true;
                                  on_not_sent:
                                    then:
                                      - lambda: |-
                                          ESP_LOGW("growatt_write", "Readback konnte nicht gesendet werden");
                              - wait_until:
                                  condition:
                                    lambda: 'return id(growatt_readback_received);'
                                  timeout: 2500ms
                              - lambda: |-
                                  if (id(growatt_readback_received)) {
                                    const bool first_ok = id(growatt_readback_1) == (uint16_t) value_1;
                                    const bool second_ok = register_count == 1 ||
                                        id(growatt_readback_2) == (uint16_t) value_2;
                                    if (first_ok && second_ok) {
                                      id(growatt_write_verified) = true;
                                      ESP_LOGI("growatt_write",
                                               "Write verifiziert: Reg %d = %u%s",
                                               address_1, id(growatt_readback_1),
                                               register_count == 2 ? "; zweites Register ebenfalls OK" : "");
                                    } else {
                                      ESP_LOGW("growatt_write",
                                               "Readback abweichend: Reg %d Soll=%u Ist=%u%s",
                                               address_1, (uint16_t)value_1, id(growatt_readback_1),
                                               register_count == 2 ? "; auch zweites Register wird geprueft" : "");
                                    }
                                  }
                        - if:
                            condition:
                              lambda: 'return !id(growatt_write_verified);'
                            then:
                              - delay: 200ms
            # Manche Growatt-Modelle uebernehmen Holding-Register zeitverzoegert.
            # Deshalb den optimistischen HA-Zustand waehrend einer kurzen Settling-
            # Phase festhalten und erst danach einen finalen Readback durchfuehren.
            - if:
                condition:
                  lambda: 'return !id(growatt_write_verified) && id(growatt_is_online);'
                then:
                  - delay: 3s
                  - lambda: |-
                      id(growatt_readback_received) = false;
                      ESP_LOGI("growatt_write", "Settling-Zeit abgelaufen, finaler Readback fuer Reg %d", address_1);
                  - modbus_client.read_holding_registers:
                      modbus_id: modbus_bus
                      address: ${modbus_device_address}
                      start_address: !lambda 'return (uint16_t) address_1;'
                      count: !lambda 'return (uint16_t) register_count;'
                      on_response:
                        then:
                          - lambda: |-
                              if (!values.empty()) id(growatt_readback_1) = values[0];
                              if (values.size() > 1) id(growatt_readback_2) = values[1];
                              id(growatt_readback_received) = true;
                  - wait_until:
                      condition:
                        lambda: 'return id(growatt_readback_received);'
                      timeout: 2500ms
                  - lambda: |-
                      if (id(growatt_readback_received)) {
                        const bool first_ok = id(growatt_readback_1) == (uint16_t) value_1;
                        const bool second_ok = register_count == 1 ||
                            id(growatt_readback_2) == (uint16_t) value_2;
                        if (first_ok && second_ok) {
                          id(growatt_write_verified) = true;
                          ESP_LOGI("growatt_write", "Write durch finalen Readback verifiziert");
                        }
                      }
            - lambda: |-
                if (id(growatt_write_verified)) {
                  // Erfolg: Fuer die sichtbaren Batterie-Controls den angeforderten
                  // Sollwert beibehalten. So kann kein spaeter/staler Pollwert die
                  // HA-Anzeige waehrend der Transaktion zurueckspringen lassen.
                  switch (address_1) {
                    case 3036: id(battery_discharge_rate).publish_state((float)value_1); break;
                    case 3037: id(battery_discharge_soc_offgrid).publish_state((float)value_1); break;
                    case 3067: id(battery_discharge_soc_ongrid).publish_state((float)value_1); break;
                    case 3047: id(battery_charge_rate).publish_state((float)value_1); break;
                    case 3048: id(battery_charge_soc).publish_state((float)value_1); break;
                    case 3049: id(battery_charge_ac).publish_state(((uint16_t)value_1 & 0x01) != 0); break;
                    case 3038: id(period1_raw_hi).publish_state((float)value_1); id(period1_raw_lo).publish_state((float)value_2); break;
                    case 3040: id(period2_raw_hi).publish_state((float)value_1); id(period2_raw_lo).publish_state((float)value_2); break;
                    case 3042: id(period3_raw_hi).publish_state((float)value_1); id(period3_raw_lo).publish_state((float)value_2); break;
                    case 3044: id(period4_raw_hi).publish_state((float)value_1); id(period4_raw_lo).publish_state((float)value_2); break;
                    case 3050: id(period5_raw_hi).publish_state((float)value_1); id(period5_raw_lo).publish_state((float)value_2); break;
                    case 3052: id(period6_raw_hi).publish_state((float)value_1); id(period6_raw_lo).publish_state((float)value_2); break;
                    case 3054: id(period7_raw_hi).publish_state((float)value_1); id(period7_raw_lo).publish_state((float)value_2); break;
                    case 3056: id(period8_raw_hi).publish_state((float)value_1); id(period8_raw_lo).publish_state((float)value_2); break;
                    case 3058: id(period9_raw_hi).publish_state((float)value_1); id(period9_raw_lo).publish_state((float)value_2); break;
                    default: break;
                  }
                  ESP_LOGI("growatt_write", "Write stabil bestaetigt (Startreg %d)", address_1);
                } else {
                  ESP_LOGE("growatt_write",
                           "Write nach Retry + Settling NICHT verifiziert (Startreg %d)", address_1);

                  // Erst jetzt gilt der Schreibvorgang als wirklich fehlgeschlagen.
                  // Nur in diesem Fall auf den tatsaechlich gelesenen Istwert
                  // zurueckspringen.
                  if (id(growatt_readback_received)) {
                    switch (address_1) {
                      case 3036: id(battery_discharge_rate).publish_state(id(growatt_readback_1)); break;
                      case 3037: id(battery_discharge_soc_offgrid).publish_state(id(growatt_readback_1)); break;
                      case 3067: id(battery_discharge_soc_ongrid).publish_state(id(growatt_readback_1)); break;
                      case 3047: id(battery_charge_rate).publish_state(id(growatt_readback_1)); break;
                      case 3048: id(battery_charge_soc).publish_state(id(growatt_readback_1)); break;
                      case 3049: id(battery_charge_ac).publish_state((id(growatt_readback_1) & 0x01) != 0); break;
                      case 3038: id(period1_raw_hi).publish_state(id(growatt_readback_1)); id(period1_raw_lo).publish_state(id(growatt_readback_2)); break;
                      case 3040: id(period2_raw_hi).publish_state(id(growatt_readback_1)); id(period2_raw_lo).publish_state(id(growatt_readback_2)); break;
                      case 3042: id(period3_raw_hi).publish_state(id(growatt_readback_1)); id(period3_raw_lo).publish_state(id(growatt_readback_2)); break;
                      case 3044: id(period4_raw_hi).publish_state(id(growatt_readback_1)); id(period4_raw_lo).publish_state(id(growatt_readback_2)); break;
                      case 3050: id(period5_raw_hi).publish_state(id(growatt_readback_1)); id(period5_raw_lo).publish_state(id(growatt_readback_2)); break;
                      case 3052: id(period6_raw_hi).publish_state(id(growatt_readback_1)); id(period6_raw_lo).publish_state(id(growatt_readback_2)); break;
                      case 3054: id(period7_raw_hi).publish_state(id(growatt_readback_1)); id(period7_raw_lo).publish_state(id(growatt_readback_2)); break;
                      case 3056: id(period8_raw_hi).publish_state(id(growatt_readback_1)); id(period8_raw_lo).publish_state(id(growatt_readback_2)); break;
                      case 3058: id(period9_raw_hi).publish_state(id(growatt_readback_1)); id(period9_raw_lo).publish_state(id(growatt_readback_2)); break;
                      default: break;
                    }
                  }
                }
            # Den Polling-Schutz nach erfolgreicher Verifikation noch kurz halten,
            # damit ein bereits vorbereiteter/staler Lesezyklus die UI nicht
            # unmittelbar wieder mit dem alten Registerwert ueberschreibt.
            - if:
                condition:
                  lambda: 'return id(growatt_write_verified);'
                then:
                  - delay: 1500ms
            - lambda: 'id(growatt_write_in_progress) = false;'
            # Kein sofortiger Full-Poll: Der naechste Heartbeat startet den
            # normalen Datenpoll ohnehin. Das vermeidet einen Stale-Read direkt
            # nach dem Write.
          else:
            - lambda: |-
                ESP_LOGW("growatt_write", "Schreibvorgang verworfen: Wechselrichter offline");

  - id: poll_emeter_fc32
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(growatt_is_online) && !id(growatt_write_in_progress);'
          then:
            - modbus_client.send:
                modbus_id: modbus_bus
                address: ${modbus_device_address}
                # PDU = Function Code 0x20 + Startregister 2 + 56 Register.
                # Adresse und CRC werden von ESPHome automatisch ergaenzt.
                pdu: [0x20, 0x00, 0x02, 0x00, 0x38]
                on_response:
                  - lambda: |-
                      // modbus_client.send liefert die rohe Response-PDU inklusive Function Code.
                      // Erwartet: [0x20][ByteCount=0x70][112 Datenbytes].
                      if (response.size() < 2) {
                        ESP_LOGW("growatt_fc32", "FC32-Antwort zu kurz: %u Byte", (unsigned) response.size());
                        return;
                      }
                      if (response[0] != 0x20) {
                        ESP_LOGW("growatt_fc32", "Unerwarteter Function Code 0x%02X", response[0]);
                        return;
                      }

                      const size_t byte_count = response[1];
                      if (response.size() < byte_count + 2) {
                        ESP_LOGW("growatt_fc32",
                                 "FC32-Antwort zu kurz: ByteCount=%u, Response=%u",
                                 (unsigned) byte_count, (unsigned) response.size());
                        return;
                      }

                      ESP_LOGD("growatt_fc32",
                               "FC32-Antwort: response.size=%u, ByteCount=%u",
                               (unsigned) response.size(), (unsigned) byte_count);

                      const auto payload = response.subspan(2, byte_count);

                      auto reg32 = [&](int value_index) -> float {
                        const size_t i = (size_t) value_index * 4;
                        if (i + 3 >= payload.size()) return NAN;
                        uint32_t raw = ((uint32_t) payload[i] << 24) |
                                       ((uint32_t) payload[i + 1] << 16) |
                                       ((uint32_t) payload[i + 2] << 8) |
                                       (uint32_t) payload[i + 3];
                        return (int32_t) raw / 10.0f;
                      };

                      id(emeter_ac_1_voltage).publish_state(reg32(0));
                      id(emeter_ac_2_voltage).publish_state(reg32(1));
                      id(emeter_ac_3_voltage).publish_state(reg32(2));
                      id(emeter_ac_1_current).publish_state(reg32(3));
                      id(emeter_ac_2_current).publish_state(reg32(4));
                      id(emeter_ac_3_current).publish_state(reg32(5));
                      id(emeter_ac_1_power).publish_state(reg32(6));
                      id(emeter_ac_2_power).publish_state(reg32(7));
                      id(emeter_ac_3_power).publish_state(reg32(8));
                      id(emeter_power).publish_state(reg32(18));
                      id(emeter_energy_total_import).publish_state(reg32(26));
                      id(emeter_energy_total_export).publish_state(reg32(27));
                on_error:
                  - lambda: |-
                      ESP_LOGW("growatt_fc32", "FC32 Modbus-Exception: %d", (int) exception_code);
                      id(emeter_ac_1_voltage).publish_state(NAN);
                      id(emeter_ac_2_voltage).publish_state(NAN);
                      id(emeter_ac_3_voltage).publish_state(NAN);
                      id(emeter_ac_1_current).publish_state(NAN);
                      id(emeter_ac_2_current).publish_state(NAN);
                      id(emeter_ac_3_current).publish_state(NAN);
                      id(emeter_ac_1_power).publish_state(NAN);
                      id(emeter_ac_2_power).publish_state(NAN);
                      id(emeter_ac_3_power).publish_state(NAN);
                      id(emeter_power).publish_state(NAN);
                      id(emeter_energy_total_import).publish_state(NAN);
                      id(emeter_energy_total_export).publish_state(NAN);
                on_no_response:
                  - lambda: |-
                      ESP_LOGW("growatt_fc32", "Keine Antwort auf FC32-Smartmeter-Abfrage");
                      id(emeter_ac_1_voltage).publish_state(NAN);
                      id(emeter_ac_2_voltage).publish_state(NAN);
                      id(emeter_ac_3_voltage).publish_state(NAN);
                      id(emeter_ac_1_current).publish_state(NAN);
                      id(emeter_ac_2_current).publish_state(NAN);
                      id(emeter_ac_3_current).publish_state(NAN);
                      id(emeter_ac_1_power).publish_state(NAN);
                      id(emeter_ac_2_power).publish_state(NAN);
                      id(emeter_ac_3_power).publish_state(NAN);
                      id(emeter_power).publish_state(NAN);
                      id(emeter_energy_total_import).publish_state(NAN);
                      id(emeter_energy_total_export).publish_state(NAN);
