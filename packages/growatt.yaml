text_sensor:
  - platform: template
    name: "Inverter run state"
    id: inverter_state
    icon: mdi:state-machine
    update_interval: ${update_interval}
    lambda: |-
      if (!id(growatt_is_online) || isnan(id(raw_inverter_state).state)) return {"unavailable"};
      int v = (int) id(raw_inverter_state).state;
      switch (v) {
        case 0: return {"Standby"};
        case 1: return {"Normal"};
        case 2: return {"Off-Grid"};
        case 3: return {"Fault"};
        default: return {to_string(v)};
      }

  - platform: template
    name: "Derating mode"
    id: inverter_derating
    icon: mdi:speedometer-slow
    update_interval: ${update_interval}
    lambda: |-
      if (!id(growatt_is_online) || isnan(id(raw_inverter_derating).state)) return {"unavailable"};
      int v = (int) id(raw_inverter_derating).state;
      static const char *reasons[] = {
        "No derating (NA)", "Bus voltage high derating", "Aging fixed power derating",
        "Grid voltage high derating", "Over-frequency reduce derating", "Single DC source mode derating",
        "Inverter module over-temperature derating", "User activated output limit derating",
        "Load speed process derating", "Over back by time derating",
        "Internal environment over-temperature derating", "External environment over-temperature derating",
        "Wire impedance derating", "Parallel inverter export limit derating",
        "Single inverter export limit derating", "Load first mode derating",
        "CT installation issue derating", "Zero current mode derating",
        "Boost module over-temperature derating", "Zero power mode derating",
        "Under-frequency increase derating", "Bus bar current limit derating"
      };
      if (v >= 0 && v < 22) return {reasons[v]};
      return {to_string(v)};

  - platform: template
    name: "Battery mode"
    id: battery_mode
    icon: mdi:battery-sync
    update_interval: ${update_interval}
    lambda: |-
      if (!id(growatt_is_online) || isnan(id(raw_battery_mode_state).state)) return {"unavailable"};
      int v = ((int) id(raw_battery_mode_state).state) / 256;
      switch (v) {
        case 0: return {"sleep"};
