  - platform: modbus_controller
    modbus_controller_id: growatt_status
    id: raw_inverter_state
    internal: true
    register_type: read
    address: 0
    value_type: S_WORD
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !isnan(x);'
            then:
              - lambda: |-
                  id(growatt_is_online) = true;
                  id(growatt_online).publish_state(true);
              - if:
                  condition:
                    lambda: 'return !id(growatt_write_in_progress);'
                  then:
                    - lambda: |-
                        if (!id(growatt_poll_initialized) ||
                            id(growatt_due_fast)) {
                          id(growatt_due_fast) = false;
                          id(growatt_data).update();
                        }
                        if (!id(growatt_poll_initialized) ||
                            id(growatt_due_temperature)) {
                          id(growatt_due_temperature) = false;
                          id(growatt_temperature).update();
                        }
                        if (!id(growatt_poll_initialized) ||
                            id(growatt_due_energy)) {
                          id(growatt_due_energy) = false;
                          id(growatt_energy).update();
                        }
                        if (!id(growatt_poll_initialized) ||
                            id(growatt_due_settings)) {
                          id(growatt_due_settings) = false;
                          id(growatt_settings).update();
                        }
                        if (!id(growatt_poll_initialized) ||
                            id(growatt_due_meter)) {
                          id(growatt_due_meter) = false;
                          id(poll_emeter_fc32).execute();
                        }
                        id(growatt_poll_initialized) = true;

