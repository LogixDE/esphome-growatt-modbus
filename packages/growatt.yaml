  - platform: modbus_controller
    modbus_controller_id: growatt_data
    id: raw_battery_mode_state
    internal: true
    register_type: read
    address: 3166
    value_type: S_WORD

  # ---- Smartmeter (Function Code 32 / 0x20), siehe Modbus.cs::SendFc32 ----
  # ESPHomes deklarative modbus_controller-Sensoren unterstuetzen nur FC 2-4,
  # daher hier als template-Sensoren, befuellt per modbus_client.send
  # im Script poll_emeter_fc32 weiter unten in dieser Datei.
  #
  # WICHTIG: Dies ist der Teil, der am ehesten von der aus der Community
  # bekannten "FC32 funktioniert manchmal nicht"-Problematik betroffen sein
  # kann. Nach dem Flashen den Logger (DEBUG) beobachten:
  #   - kommt ueberhaupt eine Antwort, oder Timeout?
  #   - Log-Zeile "Modbus user-defined function 20 found" sollte erscheinen
  # Falls Werte falsch skaliert wirken (Faktor 10/100 daneben), per
  # logger.level: VERBOSE die Rohbytes ansehen und den Offset/die Bytefolge
  # in der Lambda unten anpassen - das ist der einzige Abschnitt dieser
  # Config, der ohne echte Hardware nicht abschliessend verifiziert werden kann.
  - platform: template
    name: "Grid voltage phase 1"
    id: emeter_ac_1_voltage
    unit_of_measurement: "V"
    device_class: "voltage"
    state_class: "measurement"
    accuracy_decimals: 1
  - platform: template
    name: "Grid voltage phase 2"
