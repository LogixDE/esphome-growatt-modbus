name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: model
    attributes:
      label: Growatt model
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Inverter firmware
  - type: input
    id: esphome
    attributes:
      label: ESPHome version
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Problem description
      description: What did you expect and what happened instead?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant DEBUG log
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed passwords, API keys, serial numbers and other private data.
          required: true
