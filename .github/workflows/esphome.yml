name: ESPHome compile

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install ESPHome
        run: python -m pip install "esphome==2026.9.1"
      - name: Validate configuration
        run: esphome config examples/growatt-ci.yaml
      - name: Compile firmware
        run: esphome compile examples/growatt-ci.yaml
